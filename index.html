<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f1ef">
  <title>图片编辑器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202020'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./assets/glyphs.js"></script>
  <script defer src="./render.js"></script>
  <script defer src="./assets/cover-recipes.js"></script>
  <script defer src="./archive.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="cross" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m6 0h6v-6M8 12h8m-4-4v8"/></symbol>
    <symbol id="open" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m4 17 5-4 3 2 4-5 4 4"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2.5 12s3.4-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.4 5.5-9.5 5.5-9.5-5.5-9.5-5.5Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.2 6.5M4 5v6h6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>

  </svg>
  <header class="toolbar">
    <div class="document">
      <div class="mark" aria-hidden="true"><svg><use href="#cross"/></svg></div>
      <span class="document-name" id="file-name">示例图</span>
    </div>
    <div class="toolbar-actions">
      <button type="button" class="button" id="open-image"><svg><use href="#open"/></svg><span>导入图片</span></button>
      <button type="button" class="button primary" id="export"><svg><use href="#download"/></svg><span>导出 PNG</span></button>
    </div>
    <input id="image-file" type="file" accept="image/*" hidden>
  </header>
  <main class="workspace">
    <section class="viewer" aria-label="预览">
      <div class="viewer-header">
        <span class="viewer-label"><span class="status-dot"></span>预览</span>
        <button type="button" class="quiet compare" id="compare" aria-pressed="false"><svg><use href="#eye"/></svg>原图</button>
      </div>
      <div class="stage" id="stage">
        <div class="artboard" id="artboard">
          <canvas id="preview" role="img" aria-label="编辑后的图片"></canvas>
          <i class="corner top-left"></i><i class="corner top-right"></i>
          <i class="corner bottom-left"></i><i class="corner bottom-right"></i>
        </div>
        <div class="drop" id="drop" hidden><svg><use href="#plus"/></svg></div>
      </div>
      <div class="viewer-footer">
        <output id="resolution"></output>
        <span class="center-marker" aria-hidden="true"><svg><use href="#cross"/></svg></span>
        <output id="zoom"></output>
      </div>
    </section>
    <aside class="inspector" aria-label="编辑">
      <section class="panel">
        <div class="section-head">
          <h2><span class="section-number">01</span>字形</h2>
          <div class="section-actions">
            <button type="button" class="quiet icon-button" id="custom-glyph" title="导入字形或谱面" aria-label="导入字形或谱面"><svg><use href="#plus"/></svg></button>
          </div>
          <input id="glyph-file" type="file" accept="image/*,.osz,.zip" hidden>
        </div>
        <div class="switch" aria-label="字形类别">
          <button type="button" data-family="number" aria-pressed="true">数字</button>
          <button type="button" data-family="greek" aria-pressed="false">希腊字母</button>
        </div>
        <div class="glyphs" id="glyphs" aria-label="段位"></div>
        <div class="variant-list" id="variants" aria-label="字样"></div>
        <div class="slider" id="size-control"></div>
      </section>
      <section class="panel effects">
        <div class="section-head">
          <h2><span class="section-number">02</span>后处理</h2>
          <button type="button" class="quiet icon-button" id="reset-effects" title="重置后处理" aria-label="重置后处理"><svg><use href="#reset"/></svg></button>
        </div>
        <div class="presets" id="presets" aria-label="效果预设"></div>
        <div class="switch scope" aria-label="后处理范围">
          <button type="button" data-scope="background" aria-pressed="true">底图</button>
          <button type="button" data-scope="all" aria-pressed="false">全图</button>
        </div>
        <div class="sliders" id="effects"></div>
      </section>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
